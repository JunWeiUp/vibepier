# Paste inside the existing `server { listen 443 ssl; server_name relay.example.com; ... }` block.
# Only this exact path is routed to the relay; every other location is untouched.
location = /vibepier/relay {
    proxy_pass http://127.0.0.1:47801;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}
